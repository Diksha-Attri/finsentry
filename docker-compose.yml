services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: finsentry_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=0

  redis:
    image: redis:7.4-alpine
    container_name: finsentry_redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes
